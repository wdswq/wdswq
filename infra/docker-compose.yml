version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: monorepo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monorepo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monorepo-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: monorepo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - monorepo-network

  # LocalStack (AWS services simulation)
  localstack:
    image: localstack/localstack:latest
    container_name: monorepo-localstack
    environment:
      - DEBUG=1
      - SERVICES=s3,sqs,lambda,dynamodb
      - DATA_DIR=/tmp/localstack/data
    ports:
      - '4566:4566'
    volumes:
      - localstack_data:/tmp/localstack
      - ./infra/localstack:/docker-entrypoint-initaws.d
    networks:
      - monorepo-network

volumes:
  postgres_data:
  redis_data:
  localstack_data:

networks:
  monorepo-network:
    driver: bridge
